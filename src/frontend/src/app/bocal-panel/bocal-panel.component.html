<div [ngStyle]="pageStyle">

  <!-- ── Section nav (route-driven tabs) ───────────────────── -->
  <nav [ngStyle]="navStyle">
    @for (tab of tabs; track tab.path; let i = $index) {
      <app-btn
        [variant]="activeTab() === i ? 'primary' : 'ghost'"
        size="lg"
        (clicked)="selectTab(tab)">
        <mat-icon>{{ tab.icon }}</mat-icon>
        {{ tab.label }}
      </app-btn>
    }
  </nav>

  <router-outlet />

</div>
